name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag and build candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match VERSION=$VERSION" >&2
            exit 1
          }
          make package
          sha256sum -c dist/*.sha256
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --generate-notes \
            --title "AeSH $GITHUB_REF_NAME"
