name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and public runner
        run: make check
      - name: Build release packages
        run: make package
      - name: Verify package checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/*.sha256
          test "$(cat VERSION)" = "$(grep -oE 'VERSION = \"[^\"]+' tools/ryzc | head -1 | cut -d\" -f2)"
          test "$(cat VERSION)" = "$(grep -oE 'let VERSION[[:space:]]*=[[:space:]]*\"[^\"]+' aesh.ryz | head -1 | cut -d\" -f2)"
      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: aesh-candidate-${{ github.sha }}
          path: dist/*
